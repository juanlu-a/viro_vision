# Supabase project configuration. See docs/supabase.md.
project_id = "virovision"

[functions.vision]
# ADR 0008's key proxy does NOT require a JWT: the app has no login (ADR 0002) and the anon key would
# travel inside the bundle anyway, so requiring it would be an indirection and not a defence. It is
# knowingly accepted in ADR 0008; the real defences are the function's per-IP brake and the spending
# cap in each provider's console.
verify_jwt = false

[functions.telemetry]
# Same criterion as `vision` (ADR 0008): the app has no login, so requiring a JWT would be asking for
# an anon key that already travels inside the bundle. The worst that can happen here is noise in a
# development table, and the per-batch and per-detail caps bound it.
verify_jwt = false
