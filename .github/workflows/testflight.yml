name: TestFlight

# Uploads a build to TestFlight from a GitHub macOS runner (free: the repo is public).
#
# One app, two TestFlight groups (decision of 2026-08-30 — see docs/dev-build-ios.md):
#   - push to staging → the INTERNAL group "Equipo ViroVision": the devs get it in minutes, with no
#                       Beta App Review (they are App Store Connect users).
#   - push to main    → the EXTERNAL group "Testers ViroVision" with a public link (Beta App Review,
#                       the first of each version). Reached through the staging → main release PR.
#   - manual from any branch → whichever destination is chosen (internal by default).
# Publishing the β as a separate app (a .beta bundle) was dropped: it was only needed to have both
# installed at once, and with three devs switching build from TestFlight is enough.
#
# Before compiling it runs lint + typecheck + tests: a build that reaches the testers has to have
# gone through the same as a PR. It requires the secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (an
# App Store Connect API key with the Admin role) and, optionally, the EXPO_PUBLIC_*_API_KEY ones.
on:
  push:
    branches: [main, staging]
    paths:
      - 'app/**'
      - '.github/workflows/testflight.yml'
  workflow_dispatch:
    inputs:
      destination:
        description: TestFlight group that receives the build
        default: internal
        type: choice
        options: [internal, external]
      notes:
        description: What to test (the testers see it). Empty = last commit's subject.
        default: ''
        type: string

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: ./app

env:
  # 'internal' (Equipo ViroVision, no review) or 'external' (Testers ViroVision, public link).
  # On push the branch decides (only main is external); on manual, the input. It is computed once
  # here because a job's env cannot read `env` (GitHub rejects the whole workflow while parsing — it
  # happened).
  DESTINATION: ${{ ((github.event_name == 'push' && github.ref_name == 'main') || (github.event_name == 'workflow_dispatch' && inputs.destination == 'external')) && 'external' || 'internal' }}

jobs:
  testflight:
    name: Build and upload (${{ ((github.event_name == 'push' && github.ref_name == 'main') || (github.event_name == 'workflow_dispatch' && inputs.destination == 'external')) && 'external · Testers ViroVision' || 'internal · Equipo ViroVision' }})
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      # They are inlined into the JS bundle during the archive (EXPO_PUBLIC_*), same as the local
      # .env. One key per selector provider (ADR 0006). The missing ones simply leave their model out
      # of the selector in that build; they break nothing. CAREFUL: they stay readable inside the
      # .ipa/.apk until ADR 0008's proxy is deployed.
      EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
      EXPO_PUBLIC_OPENAI_API_KEY: ${{ secrets.EXPO_PUBLIC_OPENAI_API_KEY }}
      EXPO_PUBLIC_ANTHROPIC_API_KEY: ${{ secrets.EXPO_PUBLIC_ANTHROPIC_API_KEY }}
      EXPO_PUBLIC_GROQ_API_KEY: ${{ secrets.EXPO_PUBLIC_GROQ_API_KEY }}
      # With the proxy deployed (ADR 0008) the four keys above stop being needed here: the server
      # holds them and the build goes out with none. See docs/supabase.md.
      EXPO_PUBLIC_VISION_PROXY_URL: ${{ secrets.EXPO_PUBLIC_VISION_PROXY_URL }}
      # Telemetry (the `events` table). Since 2026-09-08 the technical information is NOT on the
      # screens: without this secret the build goes to TestFlight with no diagnosis at all. It is not
      # a key, it is a URL — it is a secret only so the endpoint is not published in the repo.
      EXPO_PUBLIC_TELEMETRY_URL: ${{ secrets.EXPO_PUBLIC_TELEMETRY_URL }}
      # Off unless the secret exists and is 1: the per-reading .mp3 costs one TTS call and nobody
      # consumes it today (see app/.env.example).
      EXPO_PUBLIC_AUDIO_FILE_ENABLED: ${{ secrets.EXPO_PUBLIC_AUDIO_FILE_ENABLED }}
      EXPO_PUBLIC_SIMULATE_DEVICE: ${{ vars.EXPO_PUBLIC_SIMULATE_DEVICE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Newest Xcode available on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Install dependencies
        run: npm ci
      - name: Check the build carries some cloud model
        # It fails BEFORE the 30 minutes of build. It exists because on 2026-09-02 a build went out
        # with supermarket mode dead: the only provider secret stopped corresponding to a model in the
        # registry and nobody knew until opening the app. See app/scripts/check-keys.mjs.
        run: npm run keys
      - name: Lint · Typecheck · Test
        run: npm run lint && npm run typecheck && npm test
      - name: App Store Connect API key
        # ASC_KEY_PATH is set here and not in the job's env: the `runner` context does not exist at job
        # level and GitHub rejects the whole workflow while parsing it (first run, 2026-08-29).
        run: |
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      - name: Distribution certificate and profile (manual signing)
        # Since 2026-09-06 the archive is signed with our own certificate and an App Store profile
        # that carries the App ID's capabilities (Hotspot Configuration, wifi-info). Before, the
        # archive went unsigned and cloud automatic signing exported without the project's
        # entitlements: the app compiled, uploaded, and on the phone NEHotspotConfiguration returned
        # "internal error". Certificate and profile were created through the ASC API
        # (docs/dev-build-ios.md).
        run: |
          KEYCHAIN="$RUNNER_TEMP/virovision.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          printf '%s' "$IOS_DIST_P12_B64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_DIST_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          printf '%s' "$IOS_PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -o - -)
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID.mobileprovision"
          echo "IOS_SIGNING_PROFILE=ViroVision App Store" >> "$GITHUB_ENV"
          echo "IOS_SIGNING_TEAM=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract TeamIdentifier.0 raw -o - -)" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KEYCHAIN" | head -3
        env:
          IOS_DIST_P12_B64: ${{ secrets.IOS_DIST_P12_B64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_PROFILE_B64: ${{ secrets.IOS_PROFILE_B64 }}
      - name: Native project (prebuild + pods)
        run: npx expo prebuild --platform ios --no-install && (cd ios && pod install)
      - name: Build number
        run: echo "BUILD_NUMBER=$(date +%Y%m%d%H%M)" >> "$GITHUB_ENV"
      - name: Archive, export and upload
        run: bash scripts/testflight.sh
      - name: Assign to the group and submit to Beta App Review
        run: |
          NOTES="${{ inputs.notes }}"
          if [ -z "$NOTES" ]; then NOTES="$(git log -1 --pretty=%s) · branch ${GITHUB_REF_NAME}"; fi
          if [ "$DESTINATION" = internal ]; then EXTRA=(--group "Equipo ViroVision" --internal); else EXTRA=(--group "Testers ViroVision"); fi
          node scripts/testflight-distribute.mjs \
            --build-number "$BUILD_NUMBER" \
            --notes "$NOTES" "${EXTRA[@]}"
