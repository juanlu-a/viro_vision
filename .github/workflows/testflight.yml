name: TestFlight

# Sube un build a TestFlight desde un runner macOS de GitHub (gratis: el repo es público).
#
# Dos ramas, dos apps (decisión del 2026-08-30 — ver docs/dev-build-ios.md):
#   - push a staging → variante β  (com.virovision.app.beta, "ViroVision β") → grupo INTERNO
#                      "Equipo ViroVision": los devs la reciben en minutos, sin Beta App Review.
#   - push a main    → app oficial (com.virovision.app) → grupo externo "Testers ViroVision" con
#                      link público (Beta App Review, el primero de cada versión).
#   - manual desde cualquier rama → la variante que se elija (β por defecto).
# Son apps distintas para Apple a propósito: iOS no instala dos builds del mismo bundle, y el
# equipo quiere la de staging y la oficial conviviendo en el mismo teléfono.
#
# Antes de compilar corre lint + typecheck + tests: un build que llega a los testers tiene que
# haber pasado por lo mismo que un PR. Requiere los secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8
# (API key de App Store Connect con rol Administración) y, opcional, EXPO_PUBLIC_GEMINI_API_KEY.
on:
  push:
    branches: [main, staging]
    paths:
      - 'app/**'
      - '.github/workflows/testflight.yml'
  workflow_dispatch:
    inputs:
      variant:
        description: Qué app publicar
        default: beta
        type: choice
        options: [beta, oficial]
      notes:
        description: Qué probar (lo ven los testers). Vacío = asunto del último commit.
        default: ''
        type: string

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: ./app

env:
  # app.config.js y los scripts leen APP_VARIANT: 'beta' o vacío (= app oficial). En push lo
  # decide la rama (sólo main es oficial); en manual, el input. Se calcula una sola vez acá porque
  # el env de un job no puede leer `env` (GitHub rechaza el workflow al parsearlo — pasó).
  APP_VARIANT: ${{ ((github.event_name == 'push' && github.ref_name != 'main') || (github.event_name == 'workflow_dispatch' && inputs.variant != 'oficial')) && 'beta' || '' }}

jobs:
  testflight:
    name: Build y subida (${{ ((github.event_name == 'push' && github.ref_name != 'main') || (github.event_name == 'workflow_dispatch' && inputs.variant != 'oficial')) && 'ViroVision β' || 'ViroVision' }})
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      # Se inlinean en el bundle JS en el archive (EXPO_PUBLIC_*), igual que el .env local.
      EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
      EXPO_PUBLIC_ONDEVICE_SPIKE: ${{ vars.EXPO_PUBLIC_ONDEVICE_SPIKE }}
      EXPO_PUBLIC_SIMULATE_DEVICE: ${{ vars.EXPO_PUBLIC_SIMULATE_DEVICE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Xcode más nuevo disponible en el runner
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Install dependencies
        run: npm ci
      - name: Lint · Typecheck · Test
        run: npm run lint && npm run typecheck && npm test
      - name: API key de App Store Connect
        # ASC_KEY_PATH se fija acá y no en el env del job: el contexto `runner` no existe a nivel
        # de job y GitHub rechaza el workflow entero al parsearlo (primer run, 2026-08-29).
        run: |
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      - name: Proyecto nativo (prebuild + pods)
        run: npx expo prebuild --platform ios --no-install && (cd ios && pod install)
      - name: Número de build
        run: echo "BUILD_NUMBER=$(date +%Y%m%d%H%M)" >> "$GITHUB_ENV"
      - name: Archive, export y subida
        run: bash scripts/testflight.sh
      - name: Asignar al grupo y enviar a Beta App Review
        run: |
          NOTES="${{ inputs.notes }}"
          if [ -z "$NOTES" ]; then NOTES="$(git log -1 --pretty=%s) · rama ${GITHUB_REF_NAME}"; fi
          # β → grupo interno del equipo (sin revisión); oficial → grupo externo con link público.
          if [ "$APP_VARIANT" = beta ]; then EXTRA=(--group "Equipo ViroVision" --internal); else EXTRA=(--group "Testers ViroVision"); fi
          node scripts/testflight-distribute.mjs \
            --build-number "$BUILD_NUMBER" \
            --notes "$NOTES" "${EXTRA[@]}"
