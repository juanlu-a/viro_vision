name: TestFlight

# Sube un build a TestFlight desde un runner macOS de GitHub (gratis: el repo es público).
#
# Una sola app, dos grupos de TestFlight (decisión del 2026-08-30 — ver docs/dev-build-ios.md):
#   - push a staging → grupo INTERNO "Equipo ViroVision": los devs la reciben en minutos, sin
#                      Beta App Review (son usuarios de App Store Connect).
#   - push a main    → grupo EXTERNO "Testers ViroVision" con link público (Beta App Review, el
#                      primero de cada versión). Se llega por el PR de release staging → main.
#   - manual desde cualquier rama → el destino que se elija (interno por defecto).
# Se descartó publicar la β como app aparte (bundle .beta): sólo hacía falta para tener las dos
# instaladas a la vez, y con tres devs alcanza con cambiar de build desde TestFlight.
#
# Antes de compilar corre lint + typecheck + tests: un build que llega a los testers tiene que
# haber pasado por lo mismo que un PR. Requiere los secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8
# (API key de App Store Connect con rol Administración) y, opcionales, las EXPO_PUBLIC_*_API_KEY.
on:
  push:
    branches: [main, staging]
    paths:
      - 'app/**'
      - '.github/workflows/testflight.yml'
  workflow_dispatch:
    inputs:
      destino:
        description: Grupo de TestFlight que recibe el build
        default: interno
        type: choice
        options: [interno, externo]
      notes:
        description: Qué probar (lo ven los testers). Vacío = asunto del último commit.
        default: ''
        type: string

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: ./app

env:
  # 'interno' (Equipo ViroVision, sin revisión) o 'externo' (Testers ViroVision, link público).
  # En push lo decide la rama (sólo main es externo); en manual, el input. Se calcula una sola vez
  # acá porque el env de un job no puede leer `env` (GitHub rechaza el workflow al parsearlo — pasó).
  DESTINO: ${{ ((github.event_name == 'push' && github.ref_name == 'main') || (github.event_name == 'workflow_dispatch' && inputs.destino == 'externo')) && 'externo' || 'interno' }}

jobs:
  testflight:
    name: Build y subida (${{ ((github.event_name == 'push' && github.ref_name == 'main') || (github.event_name == 'workflow_dispatch' && inputs.destino == 'externo')) && 'externo · Testers ViroVision' || 'interno · Equipo ViroVision' }})
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      # Se inlinean en el bundle JS en el archive (EXPO_PUBLIC_*), igual que el .env local.
      # Una clave por proveedor del selector (ADR 0006). Las que falten simplemente dejan a su
      # modelo fuera del selector en ese build; no rompen nada. OJO: quedan legibles dentro del
      # .ipa/.apk hasta que el proxy de ADR 0008 esté desplegado.
      EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
      EXPO_PUBLIC_OPENAI_API_KEY: ${{ secrets.EXPO_PUBLIC_OPENAI_API_KEY }}
      EXPO_PUBLIC_ANTHROPIC_API_KEY: ${{ secrets.EXPO_PUBLIC_ANTHROPIC_API_KEY }}
      EXPO_PUBLIC_GROQ_API_KEY: ${{ secrets.EXPO_PUBLIC_GROQ_API_KEY }}
      # Con el proxy desplegado (ADR 0008) las cuatro claves de arriba dejan de hacer falta acá:
      # las guarda el servidor y el build sale sin ninguna. Ver docs/supabase.md.
      EXPO_PUBLIC_VISION_PROXY_URL: ${{ secrets.EXPO_PUBLIC_VISION_PROXY_URL }}
      EXPO_PUBLIC_SIMULATE_DEVICE: ${{ vars.EXPO_PUBLIC_SIMULATE_DEVICE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Xcode más nuevo disponible en el runner
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Install dependencies
        run: npm ci
      - name: Lint · Typecheck · Test
        run: npm run lint && npm run typecheck && npm test
      - name: API key de App Store Connect
        # ASC_KEY_PATH se fija acá y no en el env del job: el contexto `runner` no existe a nivel
        # de job y GitHub rechaza el workflow entero al parsearlo (primer run, 2026-08-29).
        run: |
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      - name: Proyecto nativo (prebuild + pods)
        run: npx expo prebuild --platform ios --no-install && (cd ios && pod install)
      - name: Número de build
        run: echo "BUILD_NUMBER=$(date +%Y%m%d%H%M)" >> "$GITHUB_ENV"
      - name: Archive, export y subida
        run: bash scripts/testflight.sh
      - name: Asignar al grupo y enviar a Beta App Review
        run: |
          NOTES="${{ inputs.notes }}"
          if [ -z "$NOTES" ]; then NOTES="$(git log -1 --pretty=%s) · rama ${GITHUB_REF_NAME}"; fi
          if [ "$DESTINO" = interno ]; then EXTRA=(--group "Equipo ViroVision" --internal); else EXTRA=(--group "Testers ViroVision"); fi
          node scripts/testflight-distribute.mjs \
            --build-number "$BUILD_NUMBER" \
            --notes "$NOTES" "${EXTRA[@]}"
