name: Google Play

# Uploads an .aab to Google Play from a Linux runner (free: the repo is public). A mirror of the
# TestFlight workflow for the team's dev on Android:
#   - push to staging → the "internal" track: testers by email, no Google review, minutes.
#   - push to main    → the "alpha" track (closed testing): an opt-in link; the first release goes
#                       through Google's review.
#   - manual from any branch → whichever track is chosen.
#
# Gated by the PLAY_ENABLED=true variable: until the Google Play account and the service account
# exist, the job is skipped (it does not fail). Secrets: PLAY_UPLOAD_KEYSTORE_B64 (the upload key's
# .p12 in base64), PLAY_UPLOAD_KEYSTORE_PASSWORD, PLAY_SERVICE_ACCOUNT_JSON.
on:
  push:
    branches: [main, staging]
    paths:
      - 'app/**'
      - '.github/workflows/android-play.yml'
  workflow_dispatch:
    inputs:
      track:
        description: Google Play track that receives the build
        default: internal
        type: choice
        options: [internal, alpha]
      notes:
        description: Release notes (the testers see them). Empty = last commit's subject.
        default: ''
        type: string

concurrency:
  group: play-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: ./app

env:
  # The same computation and the same trap as in testflight.yml: once, at workflow level.
  TRACK: ${{ ((github.event_name == 'push' && github.ref_name == 'main') || (github.event_name == 'workflow_dispatch' && inputs.track == 'alpha')) && 'alpha' || 'internal' }}

jobs:
  play:
    name: Build and upload (${{ ((github.event_name == 'push' && github.ref_name == 'main') || (github.event_name == 'workflow_dispatch' && inputs.track == 'alpha')) && 'alpha · closed testing' || 'internal testing' }})
    if: ${{ vars.PLAY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # One key per selector provider (ADR 0006). The missing ones simply leave their model out of
      # the selector in that build; they break nothing. CAREFUL: they stay readable inside the
      # .ipa/.apk until ADR 0008's proxy is deployed.
      EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
      EXPO_PUBLIC_OPENAI_API_KEY: ${{ secrets.EXPO_PUBLIC_OPENAI_API_KEY }}
      EXPO_PUBLIC_ANTHROPIC_API_KEY: ${{ secrets.EXPO_PUBLIC_ANTHROPIC_API_KEY }}
      EXPO_PUBLIC_GROQ_API_KEY: ${{ secrets.EXPO_PUBLIC_GROQ_API_KEY }}
      # With the proxy deployed (ADR 0008) the four keys above stop being needed here: the server
      # holds them and the build goes out with none. See docs/supabase.md.
      EXPO_PUBLIC_VISION_PROXY_URL: ${{ secrets.EXPO_PUBLIC_VISION_PROXY_URL }}
      # Telemetry (the `events` table). Since 2026-09-08 the technical information is NOT on the
      # screens: without this secret the build goes out with no diagnosis at all. It is not a key, it
      # is a URL — it is a secret only so the endpoint is not published in the repo.
      EXPO_PUBLIC_TELEMETRY_URL: ${{ secrets.EXPO_PUBLIC_TELEMETRY_URL }}
      # Off unless the secret exists and is 1: the per-reading .mp3 costs one TTS call and nobody
      # consumes it today (see app/.env.example).
      EXPO_PUBLIC_AUDIO_FILE_ENABLED: ${{ secrets.EXPO_PUBLIC_AUDIO_FILE_ENABLED }}
      EXPO_PUBLIC_SIMULATE_DEVICE: ${{ vars.EXPO_PUBLIC_SIMULATE_DEVICE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm ci
      - name: Check the build carries some cloud model
        # It fails BEFORE the 30 minutes of build. It exists because on 2026-09-02 a build went out
        # with supermarket mode dead: the only provider secret stopped corresponding to a model in the
        # registry and nobody knew until opening the app. See app/scripts/check-keys.mjs.
        run: npm run keys
      - name: Lint · Typecheck · Test
        run: npm run lint && npm run typecheck && npm test
      - name: Credentials (upload key and service account)
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.p12"
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/play-sa.json"
          echo "PLAY_KEYSTORE=$RUNNER_TEMP/upload.p12" >> "$GITHUB_ENV"
          echo "PLAY_SA_PATH=$RUNNER_TEMP/play-sa.json" >> "$GITHUB_ENV"
        env:
          KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
          SA_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      - name: Build the signed .aab
        run: bash scripts/play.sh
        env:
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
      - name: Upload to Google Play
        run: |
          NOTES="${{ inputs.notes }}"
          if [ -z "$NOTES" ]; then NOTES="$(git log -1 --pretty=%s) · branch ${GITHUB_REF_NAME}"; fi
          node scripts/gplay.mjs --aab android/app/build/outputs/bundle/release/app-release.aab --track "$TRACK" --notes "$NOTES"
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
